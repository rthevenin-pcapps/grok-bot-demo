<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billable</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">B</span>
        Billable
        <span class="brand-tag">Timesheets &amp; invoicing</span>
      </div>
      <label class="signed-in">
        Signed in as
        <select id="user-select" aria-label="Signed in as"></select>
      </label>
    </header>

    <main class="layout">
      <section class="panel panel-wide" aria-labelledby="projects-heading">
        <div class="panel-header">
          <div>
            <h2 id="projects-heading">Projects</h2>
            <p class="panel-subtitle">Active client engagements and billing rates.</p>
          </div>
        </div>
        <table id="projects-table">
          <thead>
            <tr>
              <th>Client</th>
              <th>Project</th>
              <th class="num">Hourly rate</th>
              <th class="num">Entries</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
